<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 引入Markdown样式 -->
    <link rel="stylesheet" th:href="@{/css/github-markdown-light.css}">
    <style>
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }
    </style>
</head>
<body>
    <!-- 使用utext渲染未转义的HTML内容 -->
    <div class="markdown-body" th:utext="${content}"></div>

    <!-- 可选：添加代码高亮 -->
    <link rel="stylesheet" th>
    <script th></script>
</body>
</html>
